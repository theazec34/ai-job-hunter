[project]
name = "ai-job-hunter-api"
version = "0.1.0"
description = "FastAPI backend for AI Job Hunter"
requires-python = ">=3.12"
dependencies = [
  "email-validator>=2.3.0,<3",
  "fastapi>=0.117.1,<1",
  "psycopg[binary]>=3.2.10,<4",
  "pydantic-settings>=2.10.1,<3",
  "pyjwt>=2.10.1,<3",
  "pwdlib[argon2]>=0.2.1,<1",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "pytest>=8.4.2,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.13.1,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
