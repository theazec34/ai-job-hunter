[project]
name = "ai-job-hunter-api"
version = "0.1.0"
description = "FastAPI backend for AI Job Hunter"
requires-python = ">=3.12"
dependencies = [
  "email-validator>=2.3.0,<3",
  "fastapi>=0.142.2,<1",
  "httpx>=0.28.1,<1",
  "psycopg[binary]>=3.3.6,<4",
  "pydantic-settings>=2.15.0,<3",
  "pyjwt>=2.15.1,<3",
  "pypdf>=6.19.0,<7",
  "python-multipart>=0.0.32,<1",
  "pwdlib[argon2]>=0.3.1,<1",
  "sqlalchemy>=2.1.1,<3",
  "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
